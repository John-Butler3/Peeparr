<div
  class="inline-player"
  [class.is-playing]="status() === 'ready'"
  [class.is-dragging]="dragOffset() > 0"
  [style.--drag]="dragOffset()"
  (touchstart)="onDragStart($event)"
  (touchmove)="claimSwipe($event)"
>
  @if (status() === 'ready' && source()) {
    <!-- The shared video (SharedVideoService) is placed here: the same
         element the miniplayer shows, so playback and AirPlay carry on. -->
    <div #videoSlot class="video-slot"></div>
  } @else {
    <button
      type="button"
      class="poster"
      [disabled]="!playable || status() === 'loading'"
      [attr.aria-label]="playable ? 'Play ' + title : title"
      data-testid="inline-player-poster"
      [appScenePreview]="playable ? loadPreview : null"
      [scenePreviewAutoplay]="false"
      [scenePreviewHover]="false"
      [scenePreviewFadeMs]="previewFadeMs"
      [class.is-showing-site]="siteLogoShowing()"
      (click)="start()"
    >
      @if (posterUrl) {
        <img class="poster-image" [src]="posterUrl" alt="" />
      }
      <!-- The site's logo, while its preview gets ready. -->
      @if (siteLogoUrl && !siteLogoFailed()) {
        <span class="poster-site" aria-hidden="true">
          <img appLogoContrast [src]="siteLogoUrl" alt="" (error)="siteLogoFailed.set(true)" />
        </span>
      }
      @if (playable) {
        @if (status() === 'loading') {
          <span class="poster-center" aria-hidden="true">
            <p-progressSpinner strokeWidth="4" [style]="{ width: '3rem', height: '3rem' }" />
          </span>
        } @else {
          <span class="poster-center play-badge" aria-hidden="true">
            <i class="pi pi-play"></i>
          </span>
        }
      }
      @if (durationLabel(); as duration) {
        <span class="poster-duration">{{ duration }}</span>
      }
    </button>
    @if (status() === 'error') {
      <p class="inline-error" role="alert">
        Couldn't load the stream from Stash. Tap to try again.
      </p>
    }
  }
</div>
