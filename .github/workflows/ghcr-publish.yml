name: Publish GHCR Image

# main as it moves (edge), and each release's version. Release Please calls
# this for a release it publishes (its tag, made with the workflow token,
# wouldn't start it), and it can be run by hand for an existing release.
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.9.0)
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  # The release being published, if it's one: given, or the tag pushed.
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  publish:
    name: Publish App Image
    runs-on: ubuntu-latest

    steps:
      - name: Check the release tag
        if: ${{ env.RELEASE_TAG != '' }}
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/peeparr
          tags: |
            type=raw,value=edge,priority=700,enable=${{ env.RELEASE_TAG == '' && github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ env.RELEASE_TAG == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{raw}},value=${{ env.RELEASE_TAG }},priority=950,enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.RELEASE_TAG }},priority=900,enable=${{ env.RELEASE_TAG != '' }}
            type=semver,pattern=v{{major}},value=${{ env.RELEASE_TAG }},priority=850,enable=${{ env.RELEASE_TAG != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_TAG != '' }}
          labels: |
            org.opencontainers.image.title=peeparr
            org.opencontainers.image.description=Peeparr production app image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Resolve app version
        id: app-version
        shell: bash
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PEEPARR_VERSION=${{ steps.app-version.outputs.value }}
