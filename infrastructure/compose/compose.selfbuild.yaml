# Stasharr compose file for installs built from this repository's source
# (scripts/install.sh writes this to /opt/stasharr/compose.yaml).
#
# The app image is built locally from the source checkout as
# stasharr-portal:custom, so it's always the checked-out version. Secrets and
# per-install settings live in .env next to this file (written once by the
# installer with a random database password; keep it private).

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-stasharr}
  POSTGRES_USER: ${POSTGRES_USER:-stasharr}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      <<: *db-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    image: ${STASHARR_IMAGE:-stasharr-portal:custom}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Generated session secret and "Forgot password?" temporary password.
      - app_data:/var/lib/stasharr
    environment:
      <<: *db-env
      DATABASE_HOST: postgres
      DATABASE_URL: ""
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_MIGRATION_MAX_ATTEMPTS: 30
      DATABASE_MIGRATION_RETRY_DELAY_SECONDS: 2
      # Set to "true" in .env once Stasharr is served over HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Uncomment in .env if catalog checks time out on IPv4-only networks:
      # NODE_OPTIONS=--no-network-family-autoselection
      NODE_OPTIONS: ${NODE_OPTIONS:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

# Named after the compose project (default "stasharr"), e.g.
# stasharr_postgres_data and stasharr_app_data.
volumes:
  postgres_data:
  app_data:
